<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-watcher</title>
<link rel="icon" href="data:,">
<style>
:root {
  --page: #fafafa; --card: #ffffff; --raised: #f4f4f5;
  --text: #171717; --text-2: #525252; --muted: #737373; --line: rgba(23, 23, 23, 0.1); --line-strong: rgba(23, 23, 23, 0.24);
  --fill: #171717; --fill-hover: #333333; --on-fill: #ffffff;
  --tally: #dc2626; --on-tally: #ffffff; --cam: #1f7a8c; --on-cam: #ffffff;
  --display: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, Consolas, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
:root { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #141415; --card: #19191b; --raised: #232325;
  --text: #ededed; --text-2: #a1a1a6; --muted: #85858b; --line: rgba(237, 237, 237, 0.1); --line-strong: rgba(237, 237, 237, 0.24);
  --fill: #ededed; --fill-hover: #ffffff; --on-fill: #141415;
  --tally: #e5484d; --on-tally: #141415; --cam: #4fb3c6; --on-cam: #141415;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/20px var(--body); }
h1, h2 { font-family: var(--display); margin: 0; }
h1 { font-size: 18px; line-height: 1; font-weight: 600; letter-spacing: 0.02em; }
h2 { font-size: 16px; line-height: 20px; font-weight: 500; margin-bottom: 16px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.bar {
  position: sticky; top: 0; z-index: 2; min-height: 60px; background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px max(32px, calc((100% - 1376px) / 2)); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
}
.offline main { display: none; }
.gate { max-width: 624px; margin: 96px auto; padding: 0 32px; }
.gate h2 { font-size: 20px; line-height: 24px; margin-bottom: 12px; }
.gate p { margin: 0 0 8px; color: var(--text-2); }
.gate code { font: 13px/20px var(--mono); color: var(--text); background: var(--raised); padding: 2px 4px; border-radius: 4px; }
.bar label { color: var(--text-2); }
.channel { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 400px; }
.channel input { flex: 1; min-width: 0; }
.status { display: flex; align-items: center; gap: 8px; margin-left: auto; min-height: 36px; color: var(--text-2); }
.lamp { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.running .lamp { background: var(--tally); border-color: var(--tally); animation: tally 1.6s ease-in-out infinite; }
.running .status { color: var(--text); }
@keyframes tally { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .running .lamp { animation: none; } }
.notice { flex-basis: 100%; margin: 0; color: var(--tally); font-weight: 500; }
.notice:empty { display: none; }

input[type="text"], select {
  height: 36px; width: 100%; padding: 0 12px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px;
  font-variant-numeric: tabular-nums; transition: border-color 150ms var(--ease);
}
input[type="text"]:hover, select:hover { border-color: var(--muted); }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--fill); }
button {
  height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); cursor: pointer;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 150ms var(--ease);
}
button:hover:not(:disabled) { background: var(--raised); }
button:active:not(:disabled) { transform: scale(0.98); }
button:disabled { color: var(--muted); cursor: default; }
button.go { background: var(--fill); border-color: var(--fill); color: var(--on-fill); font-weight: 500; }
button.go:hover:not(:disabled) { background: var(--fill-hover); border-color: var(--fill-hover); }
button.go:disabled { background: var(--raised); border-color: var(--line); color: var(--muted); }
.running button.halt:not(:disabled) { background: var(--tally); border-color: var(--tally); color: var(--on-tally); font-weight: 500; }

main {
  max-width: 1440px; margin: 0 auto; padding: 32px;
  display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; align-items: start;
}
.tools { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 24px; }
.settings section { padding: 24px 0; border-top: 1px solid var(--line); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 24px; }
.field label { display: block; font-weight: 500; margin-bottom: 4px; }
.field.check label { display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0; }
.field.wide { grid-column: 1 / -1; }
.control { display: flex; align-items: center; gap: 8px; max-width: 240px; }
.short .control { max-width: 128px; }
.wide .control { max-width: 560px; }
.unit { color: var(--muted); font: 12px/16px var(--mono); }
.help { margin: 4px 0 0; color: var(--text-2); font-size: 13px; max-width: 44ch; }
.help::first-letter { text-transform: uppercase; }
.field { position: relative; }
.tip {
  position: absolute; z-index: 3; left: 0; top: calc(100% + 8px); width: min(320px, 100vw - 32px); margin: 0; padding: 12px;
  background: var(--fill); color: var(--on-fill); border-radius: 8px; font-size: 13px; pointer-events: none;
  opacity: 0; visibility: hidden; transition: opacity 180ms var(--ease), visibility 180ms var(--ease);
}
.field:hover .tip, .field:focus-within .tip { opacity: 1; visibility: visible; transition-delay: 350ms; }

aside { position: sticky; top: 92px; display: grid; gap: 32px; }
.stage { display: flex; gap: 16px; align-items: center; }
.frame {
  flex: none; display: flex; flex-direction: column; overflow: hidden;
  border: 2px solid var(--text); border-radius: 12px; background: var(--raised);
}
.frame div { display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; text-align: center; padding: 4px; color: var(--text-2); }
.frame .cam { background: var(--cam); color: var(--on-cam); font-weight: 500; }
.caption { margin: 0; color: var(--text-2); font-size: 13px; }
.caption strong { display: block; margin-bottom: 4px; color: var(--text); font: 500 20px/24px var(--display); font-variant-numeric: tabular-nums; }
#log {
  margin: 0; height: 320px; overflow: auto; padding: 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; font: 12px/18px var(--mono); white-space: pre-wrap; word-break: break-word;
}
#log:empty::before { content: "Nothing yet - enter a channel and start watching"; color: var(--muted); font-family: var(--body); }

@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 24px; }
  aside { position: static; }
  .bar { padding: 12px 16px; position: static; }
  .status { margin-left: 0; }
  #log { height: 260px; }
}
</style>
<script>
// runs before the page is drawn so the chosen theme never flashes; "auto" follows the system
(function () {
  let saved = "auto";
  try { saved = localStorage.getItem("theme") || "auto"; } catch (error) {}
  const dark = matchMedia("(prefers-color-scheme: dark)");
  window.theme = {
    get: () => saved,
    set(value) {
      saved = value;
      try { localStorage.setItem("theme", value); } catch (error) {}
      this.paint();
    },
    paint() { document.documentElement.dataset.theme = saved === "auto" ? (dark.matches ? "dark" : "light") : saved; },
  };
  dark.addEventListener("change", () => window.theme.paint());
  window.theme.paint();
})();
</script>
</head>
<body>
<header class="bar" id="bar">
  <h1>clip-watcher</h1>
  <div class="channel">
    <label for="channel">Channel</label>
    <input type="text" id="channel" autocomplete="off" spellcheck="false" placeholder="Name or twitch.tv / kick.com link">
  </div>
  <button class="go" id="start">Start watching</button>
  <button class="halt" id="stop" disabled>Stop</button>
  <div class="status" role="status"><span class="lamp"></span><span id="status">Not recording</span></div>
  <button id="theme" aria-label="Colour theme"></button>
  <p class="notice" id="notice" role="alert"></p>
</header>
<div class="gate" id="gate" hidden>
  <h2 id="gate-title"></h2>
  <p id="gate-text"></p>
  <p>On Windows, double-click <code>watch.bat</code> in the clip-watcher folder. On Linux or macOS, run <code>./watch.sh</code>. Keep the window it opens; closing it stops clip-watcher.</p>
</div>
<main>
  <div class="settings">
    <div class="tools">
      <button id="save">Save preset</button>
      <button id="load">Load preset</button>
      <button id="reset">Reset to defaults</button>
      <button id="clips">Open clips folder</button>
      <input type="file" id="file" accept=".txt,text/plain" hidden>
    </div>
    <div id="form"></div>
  </div>
  <aside>
    <section>
      <h2>Clip layout</h2>
      <div class="stage">
        <div class="frame" id="frame" aria-hidden="true"></div>
        <p class="caption" id="caption"></p>
      </div>
    </section>
    <section>
      <h2>Log</h2>
      <pre id="log" role="log" aria-live="polite" tabindex="0"></pre>
    </section>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const token = "__TOKEN__";  // filled in by gui.py when it serves this page
const HELPER = "http://127.0.0.1:8791/";
const fields = {};
let next = 0;

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? {"X-Token": token, "Content-Type": "application/json"} : {"X-Token": token},
    body: body ? JSON.stringify(body) : undefined,
  }).catch(() => { throw new Error("clip-watcher is not running any more - start it again with watch.bat or ./watch.sh"); });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function el(tag, props, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function build(groups) {
  for (const group of groups) {
    const grid = el("div", {className: "fields"});
    for (const opt of group.options) {
      const id = "o" + opt.flag, helpId = "h" + opt.flag;
      let input, field;
      if (opt.kind === "bool") {
        input = el("input", {type: "checkbox", id});
        field = el("div", {className: "field check"}, el("label", {}, input, opt.label));
      } else {
        input = opt.kind === "choice"
          ? el("select", {id}, ...opt.choices.map(c => el("option", {value: c}, c)))
          : el("input", {type: "text", id, autocomplete: "off", spellcheck: false});
        // numbers get a short box, templates the full row, everything else a medium one
        const size = String(opt.default).includes("{") ? " wide"
          : opt.unit || opt.kind === "choice" || /^[\d.:]+$/.test(String(opt.default)) ? " short" : "";
        const control = el("div", {className: "control"}, input);
        if (opt.unit) control.append(el("span", {className: "unit"}, opt.unit));
        field = el("div", {className: "field" + size}, el("label", {htmlFor: id}, opt.label), control);
      }
      input.setAttribute("aria-describedby", helpId + " t" + opt.flag);
      input.addEventListener("input", preview);
      field.append(el("p", {className: "help", id: helpId}, opt.help));
      if (opt.detail) field.append(el("p", {className: "tip", id: "t" + opt.flag, role: "tooltip"}, opt.detail));
      grid.append(field);
      fields[opt.flag] = {opt, input};
    }
    const title = group.title[0].toUpperCase() + group.title.slice(1);
    $("form").append(el("section", {}, el("h2", {}, title), grid));
  }
}

const read = flag => {
  const {opt, input} = fields[flag];
  return opt.kind === "bool" ? input.checked : input.value.trim();
};
function write(flag, value) {
  const {opt, input} = fields[flag];
  if (opt.kind === "bool") input.checked = Boolean(value); else input.value = value;
}
function reset() {
  for (const flag in fields) write(flag, fields[flag].opt.kind === "bool" ? false : fields[flag].opt.default);
  preview();
}
// settings left at their default are omitted, so a preset only holds what was changed
function args() {
  const out = [];
  for (const flag in fields) {
    const value = read(flag);
    if (value === true) out.push(flag);
    else if (value !== false && value !== "" && value !== String(fields[flag].opt.default)) out.push(flag + "=" + value);
  }
  return out;
}
function apply(lines, keepChannel) {
  reset();
  for (const line of lines.map(l => l.trim()).filter(Boolean)) {
    const cut = line.indexOf("="), flag = cut < 0 ? line : line.slice(0, cut);
    if (fields[flag]) write(flag, cut < 0 ? true : line.slice(cut + 1));
    else if (!line.startsWith("-") && !keepChannel) $("channel").value = line;
  }
  preview();
}

function preview() {
  const frame = $("frame"), caption = $("caption");
  const m = /^(\d+):(\d+)$/.exec(read("--ratio")), height = Number(read("--height"));
  const seconds = Number(read("--before")) + Number(read("--after"));
  frame.replaceChildren();
  if (!m || !+m[1] || !+m[2] || !(height >= 16) || !(seconds > 0)) {
    frame.style.width = frame.style.height = "0";
    caption.replaceChildren("The aspect ratio must look like 9:16, with a height in pixels and a clip length above zero");
    return;
  }
  const ratio = m[1] / m[2], scale = Math.min(192, 152 / ratio);
  frame.style.height = scale + "px";
  frame.style.width = scale * ratio + "px";
  const share = Number(read("--face-share")), cam = read("--cam");
  const stacked = cam !== "off" && share > 0 && share < 1 && ratio <= 1;
  if (stacked) {
    const panel = el("div", {className: "cam"}, "Streamer cam"), game = el("div", {}, "Game");
    panel.style.flex = share;
    game.style.flex = 1 - share;
    frame.append(...(cam === "top" ? [panel, game] : [game, panel]));
  } else {
    frame.append(el("div", {style: "flex:1"}, "Centre crop"));
  }
  const width = Math.max(2, Math.floor(Math.floor(height / 2) * 2 * ratio / 2) * 2);
  caption.replaceChildren(
    el("strong", {}, `${width} x ${Math.floor(height / 2) * 2} px, ${seconds} s`),
    stacked
      ? "A small facecam gets its own panel. If the streamer fills the picture, the clip follows their face instead."
      : "One crop from the middle of the picture, or centred on the streamer when they fill it."
  );
}

function show(state) {
  const log = $("log"), pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  for (const line of state.lines) log.append(line + "\n");
  while (log.childNodes.length > 2000) log.firstChild.remove();
  if (pinned && state.lines.length) log.scrollTop = log.scrollHeight;
  next = state.next;
  $("bar").classList.toggle("running", state.running);
  $("start").disabled = state.running;
  $("stop").disabled = !state.running || state.stopping;
  $("status").textContent = state.stopping ? "Stopping - finishing clips in progress"
    : state.running ? "Recording"
    : state.exit ? "Stopped with an error - see the log"
    : "Not recording";
}
async function poll() {
  try {
    show(await api("/api/state?since=" + next));
  } catch (error) {
    $("status").textContent = "Not connected";
    $("notice").textContent = error.message;
  }
  setTimeout(poll, 1000);
}
async function act(path, body) {
  $("notice").textContent = "";
  try {
    await api(path, body);
    show(await api("/api/state?since=" + next));
  } catch (error) {
    $("notice").textContent = error.message;
  }
}

$("start").onclick = () => {
  const channel = $("channel").value.trim();
  if (!channel) { $("notice").textContent = "Enter a channel name or link first"; $("channel").focus(); return; }
  act("/api/start", {channel, args: args()});
};
$("channel").onkeydown = event => { if (event.key === "Enter") $("start").click(); };
$("stop").onclick = () => act("/api/stop", {});
$("clips").onclick = () => act("/api/open-clips", {});
$("reset").onclick = reset;
$("save").onclick = () => {
  const link = el("a", {download: "preset.txt", href: URL.createObjectURL(new Blob([args().map(a => a + "\n").join("")], {type: "text/plain"}))});
  link.click();
  URL.revokeObjectURL(link.href);
};
const themes = ["auto", "light", "dark"];
const nameTheme = () => { $("theme").textContent = "Theme: " + theme.get(); };
$("theme").onclick = () => { theme.set(themes[(themes.indexOf(theme.get()) + 1) % 3]); nameTheme(); };
nameTheme();
$("load").onclick = () => $("file").click();
$("file").onchange = async event => {
  const file = event.target.files[0];
  if (file) apply((await file.text()).split(/\r?\n/), true);
  event.target.value = "";
};

// nothing on the page works without gui.py behind it, so say how to start it instead of showing a dead form
function offline(title, text) {
  document.body.classList.add("offline");
  for (const control of document.querySelectorAll(".bar button:not(#theme), #channel")) control.disabled = true;
  $("status").textContent = "Not connected";
  $("gate-title").textContent = title;
  $("gate-text").textContent = text;
  $("gate").hidden = false;
}
if (location.protocol === "file:") {
  // opened straight from disk: hand over to the running clip-watcher if there is one
  fetch(HELPER, {mode: "no-cors"}).then(
    () => location.replace(HELPER),
    () => offline("clip-watcher is not started yet",
                  "This page is only the control panel. A browser page cannot start a recording by itself, so clip-watcher has to be running first. Once it is, this file opens straight into it.")
  );
} else {
  api("/api/options").then(({groups, last}) => {
    build(groups);
    apply(last);
    poll();
  }).catch(error => offline("This page lost its connection", error.message));
}
</script>
</body>
</html>
